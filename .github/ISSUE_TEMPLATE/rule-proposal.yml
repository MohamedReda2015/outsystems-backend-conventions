name: Rule proposal
description: Propose a new backend convention, best practice or checklist rule
labels: ["rule-proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong in OutSystems server-side code without this rule? (No client names or confidential details.)
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Proposed rule
      description: The rule, written as an instruction, plus one sentence on why it matters.
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Group
      options:
        - BNM - Naming and structure
        - BLG - Business logic
        - BTX - Transactions, concurrency, idempotency
        - BDA - Data access
        - BIN - Integrations
        - BER - Errors and logging
        - BAS - Async processing
        - BPF - Performance
        - BSC - Server-side security
        - BCF - Configuration
        - BLL - Lesson learned
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options: [Blocker, Major, Minor]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to official OutSystems documentation (preferred) or a community source.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Applies to
      multiple: true
      options: [O11 Reactive Web, O11 Mobile, O11 Traditional Web, ODC]
